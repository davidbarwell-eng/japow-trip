<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Financials & Expenses | JAPOW 2026</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <header class="site-header">
    <nav class="nav-container">
      <a href="index.html" class="nav-logo">🏂 JAPOW 2026</a>
      <div class="nav-links">
        <a href="index.html">Itinerary</a>
        <a href="financials.html" class="active">Financials</a>
      </div>
    </nav>
  </header>

  <main class="main-content">
    <section class="financials-section">
      <div class="financials-header">
        <div>
          <h1>💳 Trip Financials & Ledger</h1>
          <p class="section-subtitle">Real-time breakdown of expenses, subsidies, and balances.</p>
        </div>
        <!-- Button to open GitHub Issue Form directly -->
        <a href="https://github.com/davidbarwell-eng/japow-trip/issues/new?template=add-expense.yml" 
           target="_blank" 
           class="add-expense-btn">
          ➕ Log New Expense
        </a>
      </div>

      <!-- Live Totals Summary -->
      <div class="financial-summary-cards">
        <div class="summary-card">
          <span>Total Trip Cost</span>
          <h2 id="total-trip-cost">$0 AUD</h2>
        </div>
        <div class="summary-card">
          <span>Total Dave Subsidies</span>
          <h2 id="total-subsidies" class="discount-text">$0 AUD</h2>
        </div>
      </div>

      <!-- Expense Items Table -->
      <div class="expense-table-container">
        <h3>📊 Logged Expenses</h3>
        <table class="financial-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Description</th>
              <th>Category</th>
              <th>Total (AUD)</th>
              <th>Paid By</th>
              <th>Split Rule</th>
            </tr>
          </thead>
          <tbody id="expense-rows">
            <tr><td colspan="6">Loading expenses...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8gWbAmXFbhHzS0OGwBxS8YTPNJu1SUfsZk_wJICRWUYGH5723e3OEkMdA49HHX3StgNM34wEELfoL/pub?gid=981506514&single=true&output=csv';

function loadExpenses() {
  Papa.parse(sheetCsvUrl, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      const expenses = results.data.map((row, index) => ({
        id: index + 1,
        dateAdded: row['Timestamp'] ? row['Timestamp'].split(' ')[0] : '',
        description: row['Expense Description'],
        category: row['Category'],
        amountAUD: parseFloat(row['Total Amount (AUD)']) || 0,
        paidBy: row['Paid By'],
        subsidyAUD: parseFloat(row['Leader Subsidy (AUD)']) || 0,
        splitRule: row['Split Rule']
      }));

      // Call your existing rendering function
      renderFinancials(expenses);
    }
  });
}

document.addEventListener('DOMContentLoaded', loadExpenses);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Financials & Expenses | JAPOW 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav-container">
      <a href="index.html" class="nav-logo">🏂 JAPOW 2026</a>
      <div class="nav-links">
        <a href="index.html">Itinerary</a>
        <a href="financials.html" class="active">Financials</a>
      </div>
    </nav>
  </header>

  <main class="main-content">
    <section class="financials-section">
      <div class="financials-header">
        <div>
          <h1>💳 Trip Financials & Ledger</h1>
          <p class="section-subtitle">Real-time breakdown of expenses, subsidies, and balances.</p>
        </div>
        <!-- Button to open GitHub Issue Form directly -->
        <a href="https://github.com/YOUR_GITHUB_USERNAME/YOUR_REPO_NAME/issues/new?template=add-expense.yml" 
           target="_blank" 
           class="add-expense-btn">
          ➕ Log New Expense
        </a>
      </div>

      <!-- Live Totals Summary -->
      <div class="financial-summary-cards">
        <div class="summary-card">
          <span>Total Trip Cost</span>
          <h2 id="total-trip-cost">$0 AUD</h2>
        </div>
        <div class="summary-card">
          <span>Total Dave Subsidies</span>
          <h2 id="total-subsidies" class="discount-text">$0 AUD</h2>
        </div>
      </div>

      <!-- Expense Items Table -->
      <div class="expense-table-container">
        <h3>📊 Logged Expenses</h3>
        <table class="financial-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Description</th>
              <th>Category</th>
              <th>Total (AUD)</th>
              <th>Paid By</th>
              <th>Split Rule</th>
            </tr>
          </thead>
          <tbody id="expense-rows">
            <tr><td colspan="6">Loading expenses...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    // Fetch and render expenses from expenses.json
    async function loadExpenses() {
      try {
        const response = await fetch('expenses.json');
        const expenses = await response.json();

        let totalCost = 0;
        let totalSubsidies = 0;
        const tbody = document.getElementById('expense-rows');
        tbody.innerHTML = '';

        expenses.forEach(item => {
          totalCost += item.amountAUD;
          totalSubsidies += (item.subsidyAUD || 0);

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${item.dateAdded || '-'}</td>
            <td><strong>${item.description}</strong></td>
            <td>${item.category}</td>
            <td>$${item.amountAUD.toLocaleString()}</td>
            <td>${item.paidBy}</td>
            <td><span class="badge">${item.splitRule}</span></td>
          `;
          tbody.appendChild(tr);
        });

        document.getElementById('total-trip-cost').textContent = `$${totalCost.toLocaleString()} AUD`;
        document.getElementById('total-subsidies').textContent = `$${totalSubsidies.toLocaleString()} AUD`;
      } catch (err) {
        document.getElementById('expense-rows').innerHTML = `<tr><td colspan="6">No expenses logged yet or error loading data.</td></tr>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadExpenses);
  </script>
</body>
</html>

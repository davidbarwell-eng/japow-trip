name: "➕ Add Trip Expense"
description: "Submit a new expense to update the trip financials ledger."
title: "[Expense]: "
labels: ["expense"]
body:
  - type: input
    id: description
    attributes:
      label: "Expense Description"
      placeholder: "e.g., Otaru Airbnb Deposit, Hokkaido 4WD Rental, Gas Fill-up"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: "Category"
      options:
        - "Flights"
        - "Car Rental & Transport"
        - "Accommodation"
        - "Lift Passes"
        - "Food & Dining"
        - "Other"
    validations:
      required: true

  - type: input
    id: amount_aud
    attributes:
      label: "Total Amount (AUD)"
      placeholder: "e.g., 1200"
    validations:
      required: true

  - type: dropdown
    id: paid_by
    attributes:
      label: "Paid By"
      options:
        - "Dave"
        - "Rider 2"
        - "Rider 3"
    validations:
      required: true

  - type: input
    id: subsidy_aud
    attributes:
      label: "Leader Subsidy (AUD)"
      placeholder: "Amount Dave is covering/subsidizing (e.g., 100 or 0)"
      value: "0"
    validations:
      required: false

  - type: dropdown
    id: split_rule
    attributes:
      label: "Split Rule"
      options:
        - "Equal 3-Way Split"
        - "Subsidized Split"
        - "Individual / Pay As You Go"
        - "Covered by Leader"
    validations:
      required: true

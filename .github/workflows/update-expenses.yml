name: Update Expense Ledger

on:
  issues:
    types: [opened, labeled]

jobs:
  process-expense:
    if: contains(github.event.issue.labels.*.name, 'expense') || contains(github.event.issue.labels.*.name, 'Expense')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Parse Issue and Update expenses.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issueBody = context.payload.issue.body || '';

            function getFieldValue(sectionHeader) {
              const lines = issueBody.split('\n');
              let capturing = false;
              let valueLines = [];

              for (let line of lines) {
                const trimmed = line.trim();
                if (trimmed.toLowerCase().startsWith('###') && trimmed.toLowerCase().includes(sectionHeader.toLowerCase())) {
                  capturing = true;
                  continue;
                }
                if (capturing && trimmed.startsWith('###')) {
                  break;
                }
                if (capturing && trimmed) {
                  valueLines.push(trimmed);
                }
              }
              return valueLines.join(' ').trim();
            }

            const description = getFieldValue('Expense Description');
            const category = getFieldValue('Category');
            const amountAUD = parseFloat(getFieldValue('Total Amount (AUD)')) || 0;
            const paidBy = getFieldValue('Paid By');
            const subsidyAUD = parseFloat(getFieldValue('Leader Subsidy (AUD)')) || 0;
            const splitRule = getFieldValue('Split Rule');

            const newExpense = {
              id: Date.now(),
              description,
              category,
              amountAUD,
              paidBy,
              subsidyAUD,
              splitRule,
              dateAdded: new Date().toISOString().split('T')[0]
            };

            const filePath = './expenses.json';
            let expenses = [];
            if (fs.existsSync(filePath)) {
              try {
                expenses = JSON.parse(fs.readFileSync(filePath, 'utf8'));
              } catch (e) {
                expenses = [];
              }
            }

            expenses.push(newExpense);
            fs.writeFileSync(filePath, JSON.stringify(expenses, null, 2));

      - name: Commit and Push Updated expenses.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add expenses.json
          git commit -m "chore: add expense from issue #${{ github.event.issue.number }}" || exit 0
          git push

      - name: Close Issue Automatically
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "✅ **Expense added to `expenses.json`!**"
            });
            github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });
